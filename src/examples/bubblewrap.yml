description: >
  Build signed APKs with melange's bubblewrap runner on a machine executor.
  `setup_bubblewrap` installs bubblewrap and allows it to create user
  namespaces, which needs sudo. Docker executors can't run bubblewrap.

usage:
  version: 2.1
  orbs:
    melange: juburr/melange-orb@1.3.0
  jobs:
    build-apks:
      machine:
        image: ubuntu-2404:current
      resource_class: arm.medium
      steps:
        - checkout
        - melange/install
        - melange/setup_bubblewrap
        - melange/keygen
        - melange/build:
            config: melange.yaml
            runner: bubblewrap
            source_dir: dist
        - melange/test:
            config: melange.yaml
            runner: bubblewrap
  workflows:
    build:
      jobs:
        - build-apks
