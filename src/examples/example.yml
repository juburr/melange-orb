description: >
  Install melange, generate a signing key, build signed APKs for the machine's
  own architecture, and run the package's tests. The packages land in
  packages/<arch>/ with a signed APKINDEX.tar.gz, ready for apko. melange
  build needs a machine executor.

usage:
  version: 2.1
  orbs:
    melange: juburr/melange-orb@1.3.0
  jobs:
    build-apks:
      machine:
        image: ubuntu-2404:current
      resource_class: arm.medium
      steps:
        - checkout
        - melange/install
        - melange/keygen
        - melange/build:
            config: melange.yaml
            source_dir: dist
        - melange/test:
            config: melange.yaml
        - persist_to_workspace:
            root: .
            paths:
              - packages
              - melange.rsa.pub
  workflows:
    build:
      jobs:
        - build-apks
