description: Installs the melange binary. This command should be invoked prior to calling any other commands.
parameters:
  caching:
    type: boolean
    default: true
  install_path:
    type: string
    default: "/home/circleci/bin"
    description: Path to a binary directory not requiring root access (no trailing slash).
  verify_checksums:
    type: enum
    enum: ["false", "known_versions", "strict"]
    default: strict
    description: >
      SHA-512 checksum verification of the downloaded Melange executable.
      "strict" (default) fails the install if this orb has no checksum for the requested version.
      "known_versions" verifies versions this orb has a checksum for, but installs any other version without verification.
      "false" disables verification entirely (not recommended).
  version:
    type: string
    default: "0.61.2"
    description: Specify the semver of the Melange version to install.
steps:
  # The cache key includes the machine architecture so that amd64 and arm64 jobs
  # never share a tarball. "uname -m" is used instead of the {{ arch }} template,
  # which also includes the CPU model and would miss the cache across hosts.
  - when:
      condition: << parameters.caching >>
      steps:
        - run:
            name: Detect Melange Cache Architecture
            command: uname -m > /tmp/melange-orb-arch
        - restore_cache:
            key: melange-cache-<< parameters.version >>-{{ checksum "/tmp/melange-orb-arch" }}
  - run:
      name: Install Melange << parameters.version >>
      environment:
        PARAM_INSTALL_PATH: << parameters.install_path >>
        PARAM_VERIFY_CHECKSUMS: << parameters.verify_checksums >>
        PARAM_VERSION: << parameters.version >>
      command: << include(scripts/install.sh) >>
  - when:
      condition: << parameters.caching >>
      steps:
        - save_cache:
            key: melange-cache-<< parameters.version >>-{{ checksum "/tmp/melange-orb-arch" }}
            paths:
              - melange.tar.gz
  - run:
      name: Cleanup Melange Install
      command: rm melange.tar.gz
