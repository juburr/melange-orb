# Tests the GitHub Actions in actions/ on GitHub's own runners, as
# .circleci/test-deploy.yml tests the orb's commands on CircleCI. Each job
# runs the actions from this checkout (uses: ./actions/...), so a pull
# request tests its own changes.
name: GitHub Actions

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the actions tests
        run: bash tests/actions_test.sh
      - name: Run the build, test, keygen and index tests against a stand-in melange
        run: bash tests/commands_test.sh

  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          # e_machine field of the ELF header: 3e00 is x86-64, b700 is aarch64.
          # Quoted, since YAML reads an unquoted 3e00 as the number 3.
          - runner: ubuntu-24.04
            elf: "3e00"
          - runner: ubuntu-24.04-arm
            elf: "b700"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/install
      - name: Verify the install
        env:
          ELF: ${{ matrix.elf }}
        run: |
          [[ "$(command -v melange)" == "${HOME}/bin/melange" ]]
          melange version | grep -F 'v0.63.1'
          od -An -tx1 -j18 -N2 "$(command -v melange)" | tr -d ' \n' | grep -Fx "${ELF}"
      # The first install saved the release to the cache, so this one
      # restores it. It goes to a directory of its own, which later steps
      # find first on the PATH.
      - uses: ./actions/install
        with:
          install_path: ${{ runner.temp }}/second
      - name: Verify the second install comes first on the PATH
        env:
          SECOND: ${{ runner.temp }}/second
        run: |
          [[ "$(command -v melange)" == "${SECOND}/melange" ]]
          melange version | grep -F 'v0.63.1'
      - name: Install an unlisted version, which must fail
        id: unlisted
        continue-on-error: true
        uses: ./actions/install
        with:
          version: 0.0.1
          caching: false
          install_path: ${{ runner.temp }}/unlisted
      - name: Verify it failed before installing anything
        env:
          OUTCOME: ${{ steps.unlisted.outcome }}
          UNLISTED: ${{ runner.temp }}/unlisted
        run: |
          [[ "${OUTCOME}" == failure ]]
          [[ ! -e "${UNLISTED}/melange" ]]

  # A fresh runner with the release's download hosts blocked installs from
  # the cache the install job saved, which only works if the cache is used.
  install-from-cache:
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Block the download hosts
        run: |
          echo "127.0.0.1 github.com objects.githubusercontent.com release-assets.githubusercontent.com" | sudo tee -a /etc/hosts
          if curl -sSf --max-time 10 -o /dev/null https://github.com; then
            echo "github.com is still reachable."
            exit 1
          fi
      - uses: ./actions/install
      - name: Verify the install
        run: melange version | grep -F 'v0.63.1'

  # Runs a workflow with the actions: generate a signing key, build a signed
  # APK for the runner's own architecture that packages a prebuilt binary,
  # run its test pipeline, then write its index again with index.
  build-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        runner: [bubblewrap, docker]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/install
      - name: Report runner prerequisites
        run: |
          uname -a
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces || true
          docker version --format 'docker server {{.Server.Version}}' || true
      - if: matrix.runner == 'bubblewrap'
        uses: ./actions/setup_bubblewrap
      - uses: ./actions/keygen
      - name: Stage prebuilt binary
        run: mkdir -p smoke-src && cp /usr/bin/true smoke-src/hello
      - uses: ./actions/build
        with:
          config: tests/smoke/melange.yaml
          runner: ${{ matrix.runner }}
          source_dir: smoke-src
      - name: Verify package
        run: bash tests/smoke/verify.sh packages smoke-src/hello melange.rsa.pub
      - uses: ./actions/test
        with:
          config: tests/smoke/melange.yaml
          runner: ${{ matrix.runner }}
      - name: Remove the index
        run: rm packages/*/APKINDEX.tar.gz
      - uses: ./actions/index
      - name: Verify the new index
        run: bash tests/smoke/verify.sh packages smoke-src/hello melange.rsa.pub

  # Signs with a key that exists only in an environment variable, base64
  # encoded, as one from a secret would: the build writes it to a private file
  # named after signing_key, so signatures name prod.rsa.pub. The key is a
  # throwaway one, generated here.
  signing-key-env-var:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/install
      - uses: ./actions/keygen
        with:
          signing_key: ${{ runner.temp }}/ci-keys/prod.rsa
      - name: Move the key into a variable
        env:
          KEY_DIR: ${{ runner.temp }}/ci-keys
        run: |
          echo "MELANGE_PROD_KEY=$(base64 -w0 "${KEY_DIR}/prod.rsa")" >> "${GITHUB_ENV}"
          cp "${KEY_DIR}/prod.rsa.pub" prod.rsa.pub
          rm "${KEY_DIR}/prod.rsa"
      - name: Stage prebuilt binary
        run: mkdir -p smoke-src && cp /usr/bin/true smoke-src/hello
      - uses: ./actions/build
        with:
          config: tests/smoke/melange.yaml
          source_dir: smoke-src
          signing_key: prod.rsa
          signing_key_env_var: MELANGE_PROD_KEY
      - name: Verify package
        run: |
          bash tests/smoke/verify.sh packages smoke-src/hello prod.rsa.pub
          [[ ! -e prod.rsa ]]

  # A build that names a key file that isn't there fails before melange runs.
  missing-key:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/install
      - id: build
        continue-on-error: true
        uses: ./actions/build
        with:
          config: tests/smoke/melange.yaml
      - name: Verify it failed without building anything
        env:
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          [[ "${OUTCOME}" == failure ]]
          [[ ! -e packages ]]
