version: 2.1
orbs:
  # Your orb will be automatically injected here during the pipeline.
  # Reference your orb's jobs and commands below as they will exist when built.
  orb-tools: circleci/orb-tools@12.5
  # The orb definition is intentionally not included here. It will be injected into the pipeline.
  melange-orb: {}

# Use this tag to ensure test jobs always run,
# even though the downstream publish job will only run on release tags.
filters: &filters
  tags:
    only: /.*/

# Filter for release tags.
release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

executors:
  machine-amd64:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
  machine-arm64:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium

jobs:
  # Create jobs to test the commands of your orbs.
  # You may want to add additional validation steps to ensure the commands are working as expected.
  command-test:
    docker:
      - image: cimg/base:current-22.04
    steps:
      - checkout
      - melange-orb/install
      - run:
          name: Verify Install
          command: |
            command -v melange
            melange version | grep -F 'v0.61.2'
            # e_machine field of the ELF header: 3e00 is x86-64.
            od -An -tx1 -j18 -N2 "$(command -v melange)" | tr -d ' \n' | grep -Fx '3e00'
  command-test-arm64:
    executor: machine-arm64
    steps:
      - checkout
      - melange-orb/install
      - run:
          name: Verify Install
          command: |
            command -v melange
            melange version | grep -F 'v0.61.2'
            # e_machine field of the ELF header: b700 is aarch64.
            od -An -tx1 -j18 -N2 "$(command -v melange)" | tr -d ' \n' | grep -Fx 'b700'
  # Runs what a pipeline does after install: generate a signing key, then build a
  # signed APK for the machine's own architecture that packages a prebuilt binary.
  build-smoke-test:
    parameters:
      executor:
        type: executor
      runner:
        type: enum
        enum: ["bubblewrap", "docker"]
    executor: << parameters.executor >>
    steps:
      - checkout
      - melange-orb/install
      - run:
          name: Report Runner Prerequisites
          command: |
            uname -a
            sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces || true
            ls -l /dev/kvm || true
            docker version --format 'docker server {{.Server.Version}}' || true
      - when:
          condition:
            equal: [bubblewrap, << parameters.runner >>]
          steps:
            - melange-orb/setup_bubblewrap
      - run:
          name: Generate Signing Key
          command: melange keygen
      - run:
          name: Stage Prebuilt Binary
          command: mkdir -p smoke-src && cp /usr/bin/true smoke-src/hello
      - run:
          name: Build Package
          command: |
            melange build tests/smoke/melange.yaml \
              --runner << parameters.runner >> \
              --arch "$(uname -m)" \
              --signing-key melange.rsa \
              --source-dir smoke-src \
              --out-dir packages
      - run:
          name: Verify Package
          command: bash tests/smoke/verify.sh packages smoke-src/hello melange.rsa.pub
  # bubblewrap can't run in a Docker executor's unprivileged container. This
  # checks that setup_bubblewrap fails there, with an error that says so,
  # rather than leaving melange build to fail later.
  setup-bubblewrap-docker-executor-test:
    docker:
      - image: cimg/base:current-22.04
    steps:
      - checkout
      - run:
          name: Expect setup_bubblewrap to Fail
          command: |
            if bash src/scripts/setup_bubblewrap.sh > setup.log 2>&1; then
              cat setup.log
              echo "setup_bubblewrap succeeded in a Docker executor; update the README's runner table."
              exit 1
            fi
            cat setup.log
            grep -F "ERROR: bwrap can't create the namespaces melange's bubblewrap runner needs" setup.log
  # The install contract runs in the setup workflow (config.yml); this checks
  # that parameter values reach circleci env subst on stdin.
  env-subst-test:
    docker:
      - image: cimg/base:current-22.04
    steps:
      - checkout
      - run:
          name: Run circleci env subst Tests
          command: bash tests/env_subst_test.sh
  shell-conventions-test:
    docker:
      - image: cimg/base:current-22.04
    steps:
      - checkout
      - run:
          name: Run Shell Conventions Test
          command: bash tests/shell_conventions_test.sh
workflows:
  test-deploy:
    jobs:
      # Make sure to include "filters: *filters" in every test job you want to run as part of your deployment.
      # Test your orb's commands in a custom job and test your orb's jobs directly as a part of this workflow.
      - command-test:
          filters: *filters
      - command-test-arm64:
          filters: *filters
      - build-smoke-test:
          matrix:
            parameters:
              executor: [machine-amd64, machine-arm64]
              runner: [bubblewrap, docker]
          filters: *filters
      - setup-bubblewrap-docker-executor-test:
          filters: *filters
      - env-subst-test:
          filters: *filters
      - shell-conventions-test:
          filters: *filters
      # The orb must be re-packed for publishing, and saved to the workspace.
      - orb-tools/pack:
          filters: *release-filters
      - orb-tools/publish:
          orb_name: juburr/melange-orb
          vcs_type: << pipeline.project.type >>
          pub_type: production
          # Ensure this job requires all test jobs and the pack job.
          requires:
            - orb-tools/pack
            - command-test
            - command-test-arm64
            - build-smoke-test
            - setup-bubblewrap-docker-executor-test
            - env-subst-test
            - shell-conventions-test
          context: orb-publishing
          filters: *release-filters
