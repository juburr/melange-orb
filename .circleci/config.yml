version: 2.1
setup: true
orbs:
  orb-tools: circleci/orb-tools@12.5
  shellcheck: circleci/shellcheck@3.4

filters: &filters
  tags:
    only: /.*/

jobs:
  test-install:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run install contract tests
          command: bash tests/install_test.sh
  test-setup-bubblewrap:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run setup_bubblewrap tests
          command: bash tests/setup_bubblewrap_test.sh

workflows:
  lint-pack:
    jobs:
      - test-install:
          filters: *filters
      - test-setup-bubblewrap:
          filters: *filters
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/review:
          orb_name: melange
          filters: *filters
      - shellcheck/check:
          filters: *filters
      - orb-tools/continue:
          pipeline_number: << pipeline.number >>
          vcs_type: << pipeline.project.type >>
          orb_name: melange-orb
          requires: [test-install, test-setup-bubblewrap, orb-tools/lint, orb-tools/pack, orb-tools/review, shellcheck/check]
          filters: *filters
