name: Build APK packages with melange
description: >
  Builds APK packages from a melange configuration with melange build, signed
  with signing_key, into out_dir/<arch>/ along with a signed APKINDEX.tar.gz
  that apko can install from. Run install first, and on a machine executor:
  neither runner works on the Docker executor. The bubblewrap runner also needs
  setup_bubblewrap. The GitHub Actions twin of the orb's build command.
author: juburr

inputs:
  arch:
    description: >
      Architectures to build, separated by commas, such as x86_64,aarch64.
      Empty builds only for this machine's architecture, which needs no
      emulation. "all" builds every architecture the package lists, as melange
      does by default.
    default: ""
  config:
    description: >
      Path of the melange configuration to build.
    default: melange.yaml
  env_file:
    description: >
      Files of environment variables to preload in the build environment,
      separated by commas, spaces or newlines.
    default: ""
  extra_args:
    description: >
      More arguments for melange build, split like shell words, such as
      --timeout 30m. Nothing in them is run as shell code.
    default: ""
  generate_index:
    description: >
      Write a signed APKINDEX.tar.gz next to the packages of each architecture.
    default: "true"
  keyring_append:
    description: >
      More public keys for the build environment's keyring, separated by
      commas, spaces or newlines, such as the key of a repository in
      repository_append.
    default: ""
  namespace:
    description: >
      Namespace for the package URLs in the packages' SBOMs, such as your
      organization's name. Empty uses melange's default, "unknown".
    default: ""
  out_dir:
    description: >
      Directory to write the packages to, in a subdirectory per architecture.
    default: packages
  package_append:
    description: >
      More packages to install in the build environment, separated by commas,
      spaces or newlines.
    default: ""
  pipeline_dirs:
    description: >
      Directories of your own pipelines for the configuration's uses: steps,
      separated by commas, spaces or newlines.
    default: ""
  repository_append:
    description: >
      More repositories for the build environment, separated by commas, spaces
      or newlines, such as the out_dir of an earlier build whose packages this
      one depends on.
    default: ""
  runner:
    description: >
      Runner that creates the isolated build environment. docker works on
      machine executors without setup; bubblewrap needs setup_bubblewrap; qemu
      needs /dev/kvm, which CircleCI's machine executors don't have.
    default: docker
  signing_key:
    description: >
      Private key to sign the packages and their index with, such as the one
      keygen writes. Empty builds unsigned packages, which apko refuses unless
      it ignores signatures. With signing_key_env_var, only its file name is
      used.
    default: melange.rsa
  signing_key_env_var:
    description: >
      Name of an environment variable holding the private key, as PEM or
      base64-encoded PEM. Set it from a secret in the env of the step that
      uses this action. The key is written to a file only the job's user can
      read, named like signing_key's file name (melange names each signature
      after it), and removed when the step ends. Empty uses the signing_key
      file.
    default: ""
  source_dir:
    description: >
      Directory whose files the build workspace starts with, such as prebuilt
      binaries to package. Empty uses the configuration file's directory, as
      melange does.
    default: ""
  vars_file:
    description: >
      File of variables for the configuration (its vars: block).
    default: ""

runs:
  using: composite
  steps:
    - name: Build packages with melange
      shell: bash
      env:
        PARAM_ARCH: ${{ inputs.arch }}
        PARAM_CONFIG: ${{ inputs.config }}
        PARAM_ENV_FILE: ${{ inputs.env_file }}
        PARAM_EXTRA_ARGS: ${{ inputs.extra_args }}
        PARAM_GENERATE_INDEX: ${{ inputs.generate_index }}
        PARAM_KEYRING_APPEND: ${{ inputs.keyring_append }}
        PARAM_NAMESPACE: ${{ inputs.namespace }}
        PARAM_OUT_DIR: ${{ inputs.out_dir }}
        PARAM_PACKAGE_APPEND: ${{ inputs.package_append }}
        PARAM_PIPELINE_DIRS: ${{ inputs.pipeline_dirs }}
        PARAM_REPOSITORY_APPEND: ${{ inputs.repository_append }}
        PARAM_RUNNER: ${{ inputs.runner }}
        PARAM_SIGNING_KEY: ${{ inputs.signing_key }}
        PARAM_SIGNING_KEY_ENV_VAR: ${{ inputs.signing_key_env_var }}
        PARAM_SOURCE_DIR: ${{ inputs.source_dir }}
        PARAM_VARS_FILE: ${{ inputs.vars_file }}
      run: >-
        bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/build.sh"
        "SCRIPT_MELANGE_LIB=${GITHUB_ACTION_PATH}/../../src/scripts/lib/melange.sh"
